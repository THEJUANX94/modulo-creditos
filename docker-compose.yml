# Infraestructura de desarrollo: SQL Server y la inicialización de la BD.
# En el paso 8 se agregan la API, el worker, la web y el mock del webhook.
#   docker compose up -d
# Las variables salen de .env (copiar .env.example).
name: modulo-creditos

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en .env}
    ports:
      - '${SQLSERVER_PORT:-1433}:1433'
    volumes:
      - sqlserverDatos:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Corre los scripts de database/ una sola vez, cuando ModuloCreditos no existe, y termina.
  dbInit:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD en .env}
    volumes:
      - ./database:/database:ro
    entrypoint: ['/bin/bash', '/database/inicializar.sh']
    restart: 'no'

volumes:
  sqlserverDatos:
