# Web del módulo de créditos (ADR 0021, ADR 0022): sirve el build de Vite y reenvía /api a la API.
# La API no se publica fuera de la red de Docker: todo entra por aquí, como en producción.

server_tokens off;

# DNS de Docker. Con la dirección en una variable, Nginx vuelve a resolver "api" cada 10 s: si la API
# se reinicia con otra IP, no queda apuntando a la vieja.
resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # La API pone sus propias cabeceras de seguridad (Helmet): aquí no se agregan, porque una segunda
  # CSP se sumaría a la suya y rompería Swagger.
  location /api/ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    # La API confía en un proxy (TRUST_PROXY=1): toma la IP del cliente del último salto.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # El mismo límite que express.json() en la API.
    client_max_body_size 100k;
  }

  # Archivos con hash en el nombre (Vite): un cambio produce otro nombre, así que no vencen nunca.
  location /assets/ {
    include /etc/nginx/snippets/cabecerasSeguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html y tema.js se revalidan siempre: un despliegue nuevo se ve de inmediato.
  # Cualquier otra ruta es de la SPA (React Router): responde index.html.
  location / {
    include /etc/nginx/snippets/cabecerasSeguridad.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
