# Cabeceras de seguridad de la web (ADR 0022). Se incluyen en cada location estática, porque un
# add_header dentro de una location anula los heredados del server.
# Sin HSTS: en local es http. En producción la agrega el balanceador que termina TLS (deploy.md).

# CSP: solo recursos del propio origen y ningún script inline (el tema se aplica desde /tema.js).
# style-src admite 'unsafe-inline' por el <style> que inserta Sonner (los toasts) al cargar. Los
# estilos que React pone en los elementos (style={...}) no los bloquea la CSP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
